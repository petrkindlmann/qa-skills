<!DOCTYPE html><html lang="en" data-framework="javascript"><head>
		<meta charset="utf-8">
		<title>VanillaJS • TodoMVC</title>
		<link rel="stylesheet" href="node_modules/todomvc-common/base.css">
		<link rel="stylesheet" href="node_modules/todomvc-app-css/index.css">
	</head>
	<body>
		<section class="todoapp">
			<header class="header">
				<h1>todos</h1>
				<input class="new-todo" placeholder="What needs to be done?" autofocus="" style="">
			</header>
			<section class="main" style="display: block;">
				<input id="toggle-all" class="toggle-all" type="checkbox" style="">
				<label for="toggle-all">Mark all as complete</label>
				<ul class="todo-list"><li data-id="1792603008864" class=" editing"><div class="view"><input class="toggle" type="checkbox" style=""><label>Alpha</label><button class="destroy"></button></div><input class="edit"></li><li data-id="1792603008907" class="completed"><div class="view"><input class="toggle" type="checkbox" style=""><label>Beta</label><button class="destroy"></button></div></li><li data-id="1792603008948" class=""><div class="view"><input class="toggle" type="checkbox" style=""><label>Gamma</label><button class="destroy"></button></div></li></ul>
			</section>
			<footer class="footer" style="display: block;">
				<span class="todo-count"><strong>2</strong> items left</span>
				<ul class="filters">
					<li>
						<a href="#/" class="selected">All</a>
					</li>
					<li>
						<a href="#/active">Active</a>
					</li>
					<li>
						<a href="#/completed">Completed</a>
					</li>
				</ul>
				<button class="clear-completed" style="display: block;">Clear completed</button>
			</footer>
		</section>
		<footer class="info">
			<p>Double-click to edit a todo</p>
			<p>Created by <a href="http://twitter.com/oscargodson">Oscar Godson</a></p>
			<p>Refactored by <a href="https://github.com/cburgmer">Christoph Burgmer</a></p>
			<p>Part of <a href="http://todomvc.com">TodoMVC</a></p>
		</footer>
		<script src="node_modules/todomvc-common/base.js"></script>
		<script src="js/helpers.js"></script>
		<script src="js/store.js"></script>
		<script src="js/model.js"></script>
		<script src="js/template.js"></script>
		<script src="js/view.js"></script>
		<script src="js/controller.js"></script>
		<script src="js/app.js"></script>
	

</body></html>
